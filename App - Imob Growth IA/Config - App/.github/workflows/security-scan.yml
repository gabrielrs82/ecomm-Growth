name: Security Vulnerability Scan (OWASP ZAP)

on:
  schedule:
    # Executa toda segunda-feira à meia-noite (UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL do ambiente de Staging para o escaneamento'
        required: true
        default: 'https://staging.ecommgrowth.online'

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Target URL
        id: resolve-url
        run: |
          # Se foi acionado manualmente via workflow_dispatch, usa a URL inserida.
          # Caso contrário (cron semanal), usa a URL de staging padrão.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.target_url }}" >> $GITHUB_OUTPUT
          else
            echo "target=https://staging.ecommgrowth.online" >> $GITHUB_OUTPUT
          fi

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: ${{ steps.resolve-url.outputs.target }}
          rules_file_name: '.github/zap-rules.tsv'
          cmd_options: '-a'
          fail_action: false # Não falhar o build diretamente para permitir envio do relatório como artefato

      - name: Upload ZAP Scan Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-report
          path: |
            zap_report.html
            zap_report.json
